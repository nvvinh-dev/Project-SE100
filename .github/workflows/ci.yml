name: CI

on:
  # Chạy cho mọi PR, kể cả PR có base là nhánh khác main (PR nối tiếp nhau).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Test tích hợp dùng Testcontainers, cần Docker có sẵn trên máy chủ ubuntu-latest.
      - name: Test
        run: dotnet test --no-build --configuration Release
